name: Deploy WellWay Production

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wellway-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: mysql://runtime:ci-only-password@127.0.0.1:3306/wellway_ci
      MIGRATION_DATABASE_URL: mysql://migration:ci-only-password@127.0.0.1:3306/wellway_ci
      BETTER_AUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      SITE_URL: https://wellway.fun
      DEFAULT_LOCALE: ar
      SITE_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload reviewed deployment script
        run: |
          scp \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -P "${{ secrets.VPS_PORT }}" \
            scripts/deploy-production.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/deploy-wellway-${{ github.sha }}.sh"

      - name: Deploy exact commit
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod 700 ~/deploy-wellway-${{ github.sha }}.sh && ~/deploy-wellway-${{ github.sha }}.sh '${{ github.sha }}'"

      - name: Verify public HTTPS health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://wellway.fun/api/health

      - name: Remove uploaded deployment script
        if: always()
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -f ~/deploy-wellway-${{ github.sha }}.sh"
